    <style>
      #map {
        height: 100vh;
      }
      .leaflet-tooltip {
        background-color: rgba(255, 255, 255, 0.9);
        border: 1px solid #ccc;
        border-radius: 4px;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
      }
      .ai-summary-container {
        max-height: 400px;
        overflow-y: auto;
      }
      .legend {
        line-height: 1.2;
        color: #333;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-radius: 50%;
        border-top: 4px solid #3498db;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

      <div class="flex justify-between items-center mb-3">

        <div id="loading-spinner" class="loader" style="display: none"></div>
      </div>

      <div class="mb-4">
        <label

        <select

          class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"

          <option value="iter21p3">iter21p3</option>

          <option value="iter21p5">iter21p5</option>
          <option value="X">X</option>

                        <div class="w-5 h-1.5 mr-2" style="background: linear-gradient(to right, rgba(20, 80, 200, 0.2), rgba(20, 80, 200, 1));"></div>

        async function loadIterationData(iteration) {
          loadingSpinner.style.display = "block";
          try {
            const graphPath = `data/${iteration}/graph_data.json`;
            const explanationPath = `data/${iteration}/explanation_data.json`;
            const timestampsPath = `data/${iteration}/timestamps.json`;

            // Fetch all three files for the selected iteration
            const [graphRes, explanationRes, timestampsRes] = await Promise.all(
              [fetch(graphPath), fetch(explanationPath), fetch(timestampsPath)]
            );

            if (!graphRes.ok) throw new Error(`Failed to load ${graphPath}`);
            if (!explanationRes.ok)
              throw new Error(`Failed to load ${explanationPath}`);
            if (!timestampsRes.ok)
              throw new Error(`Failed to load ${timestampsPath}`);

            graphData = await graphRes.json();
            explanationData = await explanationRes.json();
            timestampsData = await timestampsRes.json();

            populateSampleSelect();
            updateVisualization();
          } catch (error) {
            console.error(
              `Error loading data for iteration ${iteration}:`,
              error
            );
            alert(
              `Could not load data for "${iteration}". Please check the server console and ensure the file paths are correct.`
            );
          } finally {
            loadingSpinner.style.display = "none";
          }
        }

          sampleSelect.innerHTML = "";

            const option = document.createElement("option");
            option.value = sample;
            option.textContent = sample
              .replace(/_/g, " ")
              .replace(/\b\w/g, (l) => l.toUpperCase());
            sampleSelect.appendChild(option);
          });
        }

        function updateVisualization() {
          if (!graphData || !explanationData || !timestampsData) return;

          const selectedSample = sampleSelect.value;
          const timestep = parseInt(timestepSlider.value);
          const k = parseInt(edgeKInput.value) || 0;

          if (
            !selectedSample ||
            !explanationData[selectedSample] ||
            !timestampsData[selectedSample]
          )
            return;

          const nodeImportance =
            explanationData[selectedSample].node_importance[timestep];
          const edgeImportanceData =
            explanationData[selectedSample].edge_importance[timestep];
          const currentTimestamp = timestampsData[selectedSample][timestep];

          timestampDisplay.textContent = new Date(
            currentTimestamp
          ).toLocaleString();

          nodeMarkers.forEach((marker) => map.removeLayer(marker));
          edgeLayers.forEach((layer) => map.removeLayer(layer));
          nodeMarkers = [];
          edgeLayers = [];

          const maxNodeImportance = Math.max(
            ...nodeImportance.filter((v) => isFinite(v))
          );
          graphData.nodes.forEach((node, i) => {
            if (node.pos) {
              const importance = nodeImportance[i] || 0;
              const normalizedImportance =
                importance / (maxNodeImportance || 1);
              const radius = 4 + normalizedImportance * 12;
              const color = `rgba(255, ${
                200 - Math.floor(normalizedImportance * 180)
              }, 0, 0.8)`;

              const marker = L.circleMarker(node.pos, {
                radius,
                fillColor: color,
                color: "#333",
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.8,
              }).addTo(map);
              marker.bindTooltip(
                `<b>${node.name}</b><br>Importance: ${importance.toFixed(4)}`
              );
              nodeMarkers.push(marker);
            }
          });

          const topKEdges = graphData.edges
            .map((edge, i) => ({
              ...edge,
              importance: edgeImportanceData[i] || 0,
            }))
            .sort((a, b) => b.importance - a.importance)
            .slice(0, k);

          const maxEdgeImportance = topKEdges[0]?.importance || 1;
          topKEdges.forEach((edge) => {
            const sourceNode = graphData.nodes.find(
              (n) => n.id === edge.source
            );
            const targetNode = graphData.nodes.find(
              (n) => n.id === edge.target
            );

            if (sourceNode && targetNode && sourceNode.pos && targetNode.pos) {
              const normalizedImportance = edge.importance / maxEdgeImportance;
              const weight = 1 + normalizedImportance * 5;
              const color = `rgba(20, 80, 200, ${
                0.1 + normalizedImportance * 0.4
              })`;

              const polyline = L.polyline([sourceNode.pos, targetNode.pos], {
                color,
                weight,
              }).addTo(map);
              edgeLayers.push(polyline);
            }
          });
        }

        async function getAISummary() {
          aiSummaryContainer.style.display = "block";
          aiSummaryContent.innerHTML =
            '<p class="text-center animate-pulse">🤖 Asking AI for insights...</p>';

          const selectedIteration = modelSelect.value;
          const selectedSample = sampleSelect.value;
          const timestep = parseInt(timestepSlider.value);
          const currentTimestamp = new Date(
            timestampsData[selectedSample][timestep]
          ).toLocaleString();

          const nodeImportances = explanationData[
            selectedSample
          ].node_importance[timestep]
            .map((imp, index) => ({
              name: graphData.nodes[index]?.name || "Unknown",
              importance: imp,
            }))
            .sort((a, b) => b.importance - a.importance)
            .slice(0, 5);

          const edgeImportances = explanationData[
            selectedSample
          ].edge_importance[timestep]
            .map((imp, index) => {
              const edge = graphData.edges[index];
              if (!edge) return null;
              const sourceName =
                graphData.nodes.find((n) => n.id === edge.source)?.name ||
                "Unknown";
              const targetName =
                graphData.nodes.find((n) => n.id === edge.target)?.name ||
                "Unknown";
              return {
                name: `${sourceName} to ${targetName}`,
                importance: imp,
              };
            })
            .filter(Boolean)
            .sort((a, b) => b.importance - a.importance)
            .slice(0, 5);

          const prompt = `
                    You are an expert data scientist explaining a GNN model that predicts pedestrian flow.
                    Current Context:
                    - Model Version: ${selectedIteration}
                    - Sample Window: ${selectedSample}
                    - Timestamp: ${currentTimestamp}
                    Key Observations:
                    - Top 5 important nodes: ${nodeImportances
                      .map(
                        (n) =>
                          `${n.name} (Importance: ${n.importance.toFixed(3)})`
                      )
                      .join(", ")}.
                    - Top 5 important edges: ${edgeImportances
                      .map(
                        (e) =>
                          `${e.name} (Importance: ${e.importance.toFixed(3)})`
                      )
                      .join(", ")}.
                    Task: Provide a concise summary explaining what these importances might signify in the real world (e.g., events, traffic patterns).`;

          try {
            const response = await fetch("/api/get-summary", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ role: "user", parts: [{ text: prompt }] }],
              }),
            });
            if (!response.ok)
              throw new Error(`API request failed: ${response.status}`);
            const result = await response.json();
            if (result.candidates && result.candidates.length > 0) {
              aiSummaryContent.innerHTML =
                result.candidates[0].content.parts[0].text.replace(
                  /\n/g,
                  "<br>"
                );
            } else {
              throw new Error("No content received from API.");
            }
          } catch (error) {
            console.error("Gemini API error:", error);
            aiSummaryContent.innerHTML =
              '<p class="text-red-600">Sorry, unable to generate summary. Check the server console.</p>';
          }
        }

        modelSelect.addEventListener("change", (e) =>
          loadIterationData(e.target.value)
        );
        sampleSelect.addEventListener("change", updateVisualization);
        timestepSlider.addEventListener("input", updateVisualization);
        edgeKInput.addEventListener("input", updateVisualization);
        aiSummaryBtn.addEventListener("click", getAISummary);

        // --- Initial Load ---
        await loadIterationData(modelSelect.value);
